<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CNLHQ's Server</title>
  <meta name="description" content="CNLHQ's Server - free downloads, fast direct links" />
  <link rel="icon" href="favicon.svg?v=2" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css?v=2" />
  <script src="config.js?v=2"></script>
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <div class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 14.9A7 7 0 1 1 15.7 8h1.8a4.5 4.5 0 0 1 2.5 8.2" />
            <path d="M12 12v9" /><path d="m8.5 17.5 3.5-3.5 3.5 3.5" />
          </svg>
        </div>
        <div class="brand-text">
          <h1 id="site-name">CNLHQ's Server</h1>
          <p id="site-subtitle"></p>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="theme-toggle" title="切换主题" aria-label="切换主题">
          <svg class="theme-icon theme-moon" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="theme-icon theme-sun" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <a class="btn ghost btn-sm" id="guide-link" href="#" target="_blank" rel="noopener" title="如何上传新文件">上传说明</a>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h2 class="hero-title" id="hero-title">欢迎来到 <span>CNLHQ's Server</span></h2>
      <p class="hero-sub" id="hero-sub">免费资源 · 高速直链 · 即点即下</p>
      <div class="stats" id="stats" hidden>
        <div class="stat-card"><span class="stat-ico">📁</span><span class="stat-num" id="stat-count">–</span><span class="stat-label">资源数</span></div>
        <div class="stat-card"><span class="stat-ico">💾</span><span class="stat-num" id="stat-size">–</span><span class="stat-label">总大小</span></div>
        <div class="stat-card"><span class="stat-ico">🗂️</span><span class="stat-num" id="stat-cats">–</span><span class="stat-label">分类</span></div>
      </div>
    </section>

    <section class="toolbar" aria-label="搜索与筛选">
      <div class="search-box">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="search" id="search" placeholder="搜索文件名或描述…" autocomplete="off" />
      </div>
      <div class="sort-box">
        <select id="sort" aria-label="排序方式">
          <option value="newest">最新添加</option>
          <option value="largest">文件最大</option>
          <option value="az">名称 A→Z</option>
        </select>
      </div>
    </section>

    <section class="cats" id="cats" aria-label="分类" hidden></section>

    <section id="loading" class="loading" aria-label="加载中">
      <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
    </section>

    <section id="error" class="empty" hidden>
      <div class="empty-emoji">⚠️</div>
      <p>加载失败，请刷新重试</p>
    </section>

    <section id="empty" class="empty" hidden>
      <div class="empty-emoji">🎉</div>
      <p>暂无资源</p>
      <p class="empty-sub">管理员上传文件后会自动出现在这里</p>
    </section>

    <section class="cards" id="grid" aria-label="资源列表" hidden></section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span id="footer-text"></span>
    </div>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js?v=2"></script>
</body>
</html>
